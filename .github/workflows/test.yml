name: test

on:
  pull_request:
    branches:
      - develop
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: maven

      - name: Run tests with coverage
        run: mvn clean test

      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

      - name: Check compliance-path coverage
        if: always()
        run: |
          REPORT="target/site/jacoco/jacoco.csv"
          if [ ! -f "$REPORT" ]; then
            echo "::warning::Jacoco CSV report not found — skipping coverage gate."
            exit 0
          fi

          COMPLIANCE_CLASSES="IndexController|SessionData|OtherController|WellKnown|HydraConfig|Limit|SepaCreditTransfersBerlinGroupV13|PostConsentJson|FromAccount|ToAccount|PostConsentRequestVrpJson|AccountAccess"

          TOTAL_MISSED=0
          TOTAL_COVERED=0

          while IFS=',' read -r group package class instr_missed instr_covered br_missed br_covered line_missed line_covered compl_missed compl_covered method_missed method_covered; do
            if echo "$class" | grep -qE "^($COMPLIANCE_CLASSES)$"; then
              TOTAL_MISSED=$((TOTAL_MISSED + line_missed))
              TOTAL_COVERED=$((TOTAL_COVERED + line_covered))
            fi
          done < <(tail -n +2 "$REPORT")

          TOTAL=$((TOTAL_MISSED + TOTAL_COVERED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "::warning::No compliance-path classes found in coverage report."
            exit 0
          fi

          PERCENT=$((TOTAL_COVERED * 100 / TOTAL))
          echo "Compliance-path line coverage: ${PERCENT}% (${TOTAL_COVERED}/${TOTAL} lines)"

          if [ "$PERCENT" -lt 50 ]; then
            echo "::error::Compliance-path coverage ${PERCENT}% is below 50% minimum."
            exit 1
          elif [ "$PERCENT" -lt 70 ]; then
            echo "::warning::Compliance-path coverage ${PERCENT}% is below 70% target."
          else
            echo "Coverage meets the 70% target."
          fi
