name: test and coverage

on:
  pull_request:
    branches:
      - develop
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: maven

      - name: Run tests with coverage
        run: mvn clean test -B

      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

      - name: Check compliance-path coverage
        if: always()
        run: |
          REPORT="target/site/jacoco/jacoco.csv"
          if [ ! -f "$REPORT" ]; then
            echo "::warning::Jacoco CSV report not found — skipping coverage check."
            exit 0
          fi

          # Compliance-critical classes (from the launching system)
          COMPLIANCE_CLASSES=(
            "IndexController"
            "SessionData"
            "OtherController"
            "WellKnown"
            "Limit"
            "SepaCreditTransfersBerlinGroupV13"
            "HydraConfig"
            "PostConsentJson"
            "FromAccount"
            "ToAccount"
            "PostConsentRequestVrpJson"
            "AccountAccess"
          )

          HAS_ERROR=false
          HAS_WARNING=false

          for CLASS in "${COMPLIANCE_CLASSES[@]}"; do
            LINE=$(grep ",${CLASS}," "$REPORT" 2>/dev/null || true)
            if [ -z "$LINE" ]; then
              echo "::warning::Coverage data not found for ${CLASS} — class may not be exercised by any test."
              continue
            fi

            # Jacoco CSV columns: GROUP,PACKAGE,CLASS,INSTRUCTION_MISSED,INSTRUCTION_COVERED,...
            MISSED=$(echo "$LINE" | cut -d',' -f4)
            COVERED=$(echo "$LINE" | cut -d',' -f5)
            TOTAL=$((MISSED + COVERED))

            if [ "$TOTAL" -eq 0 ]; then
              PCT=0
            else
              PCT=$((COVERED * 100 / TOTAL))
            fi

            if [ "$PCT" -lt 50 ]; then
              echo "::error::${CLASS} instruction coverage is ${PCT}% (threshold: 50% error)"
              HAS_ERROR=true
            elif [ "$PCT" -lt 70 ]; then
              echo "::warning::${CLASS} instruction coverage is ${PCT}% (threshold: 70% warning)"
              HAS_WARNING=true
            else
              echo "${CLASS} instruction coverage: ${PCT}% — OK"
            fi
          done

          if [ "$HAS_WARNING" = true ]; then
            echo "::warning::Some compliance-path classes are below 70% coverage."
          fi

          if [ "$HAS_ERROR" = true ]; then
            echo "One or more compliance-path classes are below 50% coverage."
            exit 1
          fi
